# Configuration of a second hub, which does not retry starting the content delivery of a subscription. It joins the
# hub of resources/hub.toml as another node of the same deployment, and only delivers the content of the subscriptions
# made through it. The @...@ placeholders are replaced by the integration-tests Gradle build.

[websubhub.config.server]
port = @no.retries.hub.port@
id = "websubhub-it-no-retries"

[websubhub.config.state.snapshot]
url = "http://localhost:@consolidator.port@/consolidator/state-snapshot"

[websubhub.config.state.events]
topic = "websubhub-it/events"
consumerIdPrefix = "websubhub-it-no-retries-hub-events"

[websubhub.config.store.solace]
url = "tcp://localhost:@broker.smf.port@"
messageVpn = "default"
auth.username = "admin"
auth.password = "admin"

[websubhub.config.store.solace.consumer]
receiveTimeout = 5.0

[websubhub.config.store.solace.admin]
url = "http://localhost:@broker.semp.port@/SEMP/v2/config"
timeout = 30.0
auth.username = "admin"
auth.password = "admin"
strictQueueConfigValidation = false

[websubhub.config.store.solace.queue]
queueNamePrefix = "websubhub-it-"
messageQueueQuota = 100
queueOwner = "admin"
nonOwnerPermission = "no-access"
deliveryCountEnabled = true
respectTtl = false
maxTtl = 0
redeliver.maxCount = 10

[websubhub.config.delivery]
timeout = 30.0
startRetries = 0

[websubhub.config.delivery.retry]
count = 3
interval = 1.0
backOffFactor = 2.0
maxWaitInterval = 5.0
statusCodes = [500, 502, 503]

[websubhub.config.verification]
timeout = 30.0

[ballerina.log]
level = "INFO"

# Tracing is left off, so that the spans of this hub do not mix with those the tracing tests assert on
[ballerina.observe]
tracingEnabled = false
metricsEnabled = false
